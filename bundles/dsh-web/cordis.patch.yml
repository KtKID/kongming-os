# KMH 当前采用的 DSH 基础服务、Web 与四个 Agent 预设。
# 原版对照与升级说明见 README.md；部署覆盖由 kmh-web profile 管理。
- insert:
    # == upstream.cordis.yml
    - id: tool-plugin-manager
      name: '@deepseek-ai/dsh-plugin-manager/tools'
      disabled: true
    - id: plugin-manager
      name: '@deepseek-ai/dsh-plugin-manager'
      config:
        logRoot: !!js dshHomePath('logs', 'plugin-manager', 'kmh-web')
      disabled: !!js '!ctx.get(''profileContext'')'
    - id: timer
      name: '@deepseek-ai/cordis-plugin-timer'
    - id: hmr
      name: '@deepseek-ai/dsh-hmr'
      disabled: !!js '!ctx.get(''profileContext'')'
      config:
        root: !!js JSON.parse(process.env.KMH_PLUGIN_WATCH_ROOTS || '[]')
    - id: cli-tools
      name: '@deepseek-ai/dsh-cli-tools'
    - id: llm
      name: '@deepseek-ai/dsh-llm'
    - id: deepseek-llm-api-extensions
      name: '@deepseek-ai/dsh-deepseek-llm-api-extensions'
    - id: session
      name: '@deepseek-ai/dsh-session'
    - id: session-log-deepseek
      name: '@deepseek-ai/dsh-session-log-deepseek'
    - id: typert
      name: '@deepseek-ai/dsh-typert-registry'
    - id: typert-loader
      name: '@deepseek-ai/dsh-typert-loader'
    - id: typert-gateway
      name: '@deepseek-ai/dsh-api-gateway'
    - id: session-title
      name: '@deepseek-ai/dsh-session-title'
      config:
        fallbackMaxWords: 5
        fallbackMaxBytes: 40
        maxTitleBytes: 80
    - id: session-title-llm
      name: '@deepseek-ai/dsh-session-title-first-prompt-llm'
      config:
        targetWords: 5
        targetCjkCharacters: 10
        maxInputBytes: 4096
        maxOutputTokens: 64
        timeoutMs: 60000
    - id: user-questions
      name: '@deepseek-ai/dsh-user-questions'
    - id: agent
      name: '@deepseek-ai/dsh-agent'
    - id: plugin-package-inventory-deepseek
      name: '@deepseek-ai/dsh-plugin-package-inventory-deepseek'
    - id: agent-default-model
      name: '@deepseek-ai/dsh-agent-default-model'
      config:
        provider: deepseek-official
        model: deepseek-flash
    - id: jobs
      name: '@deepseek-ai/dsh-jobs-local'
    - id: llm-retry
      name: '@deepseek-ai/dsh-llm-retry'
    - id: config-editor
      name: '@deepseek-ai/dsh-config-editor'
      disabled: !!js '!ctx.get(''profileContext'')'
    - id: settings
      name: '@deepseek-ai/dsh-settings'
      disabled: !!js '!ctx.get(''profileContext'')'
    - id: authorization
      name: '@deepseek-ai/dsh-authorization'
    - id: deepseek-account
      name: '@deepseek-ai/dsh-deepseek-account-platform'
      config:
        desktopPlatform: !!js >-
          ctx.get('profileContext')?.name === 'desktop' && ['darwin',
          'win32'].includes(process.platform) ? process.platform : null
    - id: credentials
      name: '@deepseek-ai/dsh-credentials-local'
    - id: llm-pi-ai
      name: '@deepseek-ai/dsh-llm-pi-ai'
    - id: session-persistence-jsonl
      name: '@deepseek-ai/dsh-session-persistence-jsonl'
      config:
        root: !!js dshHomePath('sessions')
    - id: attachment-local
      name: '@deepseek-ai/dsh-attachment-local'
    - id: session-query-sqlite
      name: '@deepseek-ai/dsh-session-query-sqlite'
      config:
        path: ':memory:'
        openAt: never
    - id: session-projection
      name: '@deepseek-ai/dsh-session-projection'
    - id: storage
      name: '@deepseek-ai/dsh-storage'
    - id: storage-json
      name: '@deepseek-ai/dsh-storage-json'
      config:
        root: !!js dshHomePath('storages')
    - id: storage-domain
      name: '@deepseek-ai/dsh-storage-domain'
      config:
        backend: json
    - id: session-projection-cache
      name: '@deepseek-ai/dsh-session-projection-cache'
      config:
        writeEveryEvents: 200
        writeIntervalMs: 5000
    - id: otel
      name: '@deepseek-ai/dsh-otel'
    - id: session-telemetry-otel
      name: '@deepseek-ai/dsh-session-telemetry-otel'
      config:
        mode: !!js process.env.DSH_TELEMETRY_MODE || 'FEEDBACK_ONLY'
        shutdownTimeoutMillis: 3000
        maxRequestBytes: 4000000
        exporter:
          url: !!js >-
            process.env.DSH_TELEMETRY_OTLP_URL ??
            'https://dsh-otel-collector.deepseeksvc.com/v1/logs'
          compression: gzip
          timeoutMillis: 1000
        processor:
          scheduledDelayMillis: 10000
          maxQueueSize: 2048
          maxExportBatchSize: 2048
          exportTimeoutMillis: 1500
    - id: subprocess
      name: '@deepseek-ai/dsh-subprocess-local'
    - id: sandbox
      name: '@deepseek-ai/dsh-sandbox-local'
    - id: sandbox-policy
      name: '@deepseek-ai/dsh-sandbox-policy'
      config:
        mode: !!js process.env.DSH_PERMISSION_MODE ?? 'workspace-write'
        workspaceRoot: !!js process.cwd()
    - id: bash-sandbox
      name: '@deepseek-ai/dsh-bash-sandbox'
      disabled: !!js process.platform === 'win32'
      config:
        timeoutMs: 60000
    - id: pwsh-sandbox
      name: '@deepseek-ai/dsh-pwsh-sandbox'
      disabled: !!js process.platform !== 'win32'
    - id: approval
      name: '@deepseek-ai/dsh-user-approval'
      config:
        policy: !!js >-
          (process.env.DSH_PERMISSION_MODE ?? 'workspace-write') ===
          'danger-full-access' ? 'never' : 'ask'
    - id: permission
      name: '@deepseek-ai/dsh-permission-presets'
      config:
        presets:
          read-only:
            sandbox: read-only
            approval: ask
            name: 仅可查看
            description: 只读沙箱；写操作前请求审批。
          workspace-write:
            sandbox: workspace-write
            approval: ask
            # D17：原“工作区内修改”改为“请求审批”——Codex CLI 插件的
            # 原生审批跟随本档（审批请求桥转 KMH 用户，单次请求授权）。
            name: 请求审批
            description: 工作区沙箱；越界与原生工具操作请求用户审批。
          workspace-write-auto:
            sandbox: workspace-write
            approval: never
            # Codex 原生权限请求交官方自动审查；KMH 工具沿用宿主策略。
            name: 帮我审批
            description: 工作区沙箱；Codex 自动审查原生操作的额外权限请求。
          danger-full-access:
            sandbox: danger-full-access
            approval: never
            name: 完全权限
            description: 不经沙箱与审批直接执行（含敏感操作）。
    - id: shell-env
      name: '@deepseek-ai/dsh-shell-env'
    - id: tool-bash
      name: '@deepseek-ai/dsh-tool-bash'
      disabled: true
    - id: tool-pwsh
      name: '@deepseek-ai/dsh-tool-pwsh'
      disabled: true
    - id: tool-jobs
      name: '@deepseek-ai/dsh-tool-jobs'
      disabled: true
    - id: fs-observation-policy
      name: '@deepseek-ai/dsh-fs-observation-policy'
    - id: tool-fs
      name: '@deepseek-ai/dsh-tool-fs'
      disabled: true
    - id: tool-fs-search
      name: '@deepseek-ai/dsh-tool-fs-search'
      config:
        sampleOverCapGlobResults: false
      disabled: true
    - id: agent-instructions
      name: '@deepseek-ai/dsh-agent-instructions'
      config:
        maxBytes: 65536
      disabled: true
    - id: skill
      name: '@deepseek-ai/dsh-skill'
    - id: skill-filesystem
      name: '@deepseek-ai/dsh-skill-filesystem'
      disabled: true
    - id: skill-badge
      name: '@deepseek-ai/dsh-skill-badge'
      disabled: true
    - id: tool-skill
      name: '@deepseek-ai/dsh-tool-skill'
      disabled: true
    - id: commands
      name: '@deepseek-ai/dsh-commands'
    - id: command-feedback
      name: '@deepseek-ai/dsh-command-feedback'
    - id: goal
      name: '@deepseek-ai/dsh-goal'
    - id: goal-round-driver
      name: '@deepseek-ai/dsh-goal-round-driver'
    - id: command-goal
      name: '@deepseek-ai/dsh-command-goal'
      disabled: true
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: >
          你正处于 plan mode。在 exit_plan_mode 成功或用户切换会话模式之前，保持处于 plan
          mode。要求实现改动的祈使语气意味着规划该实现，而不是执行它。用户在对话中的同意——包括对你所提问题的确认回答——不批准任何内容，也不会结束
          plan mode；把已确认的决定纳入计划，并通过 exit_plan_mode 提交。


          先探索。使用非变更性的读取、搜索、静态分析和检查，让计划立足于实际仓库。不要编辑或写入文件、更改配置、运行会重写受跟踪文件的格式化工具或代码生成、提交，或以其他方式执行该计划。优先使用现有函数和模式，而不是新造机制。


          工具目录在各模式间保持不变，以保证请求缓存的稳定性。这些 plan mode
          规则覆盖任何后续暗示使用变更工具的工具描述或指引；那些工具仍然列出，只是为了保持请求形状稳定。不要用 todo_write
          追踪这个规划阶段：它追踪计划获批后的实现，而计划本身属于 exit_plan_mode。


          通过自行查看解决可发现的事实。ask_user_question
          只用于该由用户决定的选项或查看无法回答的实质性歧义。当你自己能查明时，不要问用户代码在哪里或当前行为如何运作。


          让计划决策完备：陈述目标与成功标准；按子系统分组实现改动；识别公共 API、schema
          与数据流变更；覆盖边界情况、失败模式、测试、验收标准和显式假设。保持精简到便于审查，又详细到另一位工程师无需再做设计决策即可实现。


          准备就绪后，调用 exit_plan_mode 并附上完整的计划 markdown，以 # 标题开头。让 exit_plan_mode
          成为该条助手响应中唯一且最后的工具调用：它呈现计划以供批准，实现只在批准之后的后续步骤开始。不要把最终计划当作普通回复粘贴，也不要通过正文或
          ask_user_question 询问“是否继续？”。如果审查拒绝，吸收反馈后再次呈现。如果审查通道不可用或中止，保持 plan mode
          并请用户手动切换模式；不要继续执行实现。
      disabled: true
    - id: token-meter
      name: '@deepseek-ai/dsh-token-meter'
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'
      disabled: true
    - id: command-compact
