# Kongming 自有插件与 Web 部署覆盖；DSH 插件由 @kmh/bundle-dsh-web 提供。
# Bundle 选择见 package.json，配置归属与覆盖语义见 README.md。
- insert:
    - id: runtime-log
      name: '@kmh/runtime-log'
      config:
        file: !!js dshHomePath('logs', 'plugins', `runtime-${process.pid}.jsonl`)
    - id: kmh-zcode-cli
      name: '@kmh/zcode-cli'
      config:
        providerId: account:bigmodel-individual-coding-plan
        cwd: !!js process.cwd()
        dataDir: !!js dshHomePath('zcode-cli')
    - id: kmh-codex-cli
      name: '@kmh/codex-cli'
      config:
        # 官方 Codex CLI 可执行文件：本机 PATH 里的 homebrew 包损坏
        # （vendor 二进制缺失），指向 ChatGPT.app 自带的 0.160.0。
        command: /Applications/ChatGPT.app/Contents/Resources/codex-cli/CodexCLI.app/Contents/MacOS/codex
        cwd: !!js process.cwd()
        dataDir: !!js dshHomePath('codex-cli')
    - id: kmh-cli-tools-selector
      name: '@kmh/cli-tools-selector'
    - id: kmh-codex-cli-trace
      name: '@kmh/codex-cli-trace'
      config:
        bindingsFile: !!js dshHomePath('codex-cli', 'codex-bindings.json')
        refreshIntervalMs: 1000
    - id: kmh-team
      name: '@kmh/kmh-team'
      config:
        contextMessageCount: 20
        memberMaxParallel: 8
    - id: kmh-echo
      name: '@kmh/kmh-echo'
      config:
        file: !!js dshHomePath('logs', 'kmh-echo', `events-${process.pid}.log`)
    - id: kmh-web-surface-zh
      name: '@kmh/web-surface-zh'
    - id: kmh-mademe
      name: '@kmh/mademe'
      # serviceUrl/mcpUrl/mcpEnabled 默认值见包内 src/config.ts；
      # 运行时经插件详情页表单修改并持久化回本 patch。
- id: webserver
  name: '@deepseek-ai/dsh-host-webserver'
  config:
    host: 127.0.0.1
    port: 60000
    compression: gzip
    compressionLevel: 1
    compressionThresholdBytes: 1024
- id: ui-settings-general
  name: '@deepseek-ai/dsh-client-ui-settings-general'
  config:
    welcomeNoticeVersion: 2026-09-28.1
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: codex-cli
    model: gpt-5.6-luna
    reasoningEffort: high
- id: subagent-model-selection-settings
  name: "@deepseek-ai/dsh-tool-subagent/model-selection-settings"
  config:
    enabled: true
    allowedModels:
      - provider: codex-cli
        model: gpt-6.1-sol
      - provider: codex-cli
        model: gpt-6-luna
      - provider: codex-cli
        model: gpt-5.6-terra
      - provider: zcode-cli
        model: glm-5.3-flash
      - provider: zcode-cli
        model: glm-5.3
- id: ui-theme
  name: "@deepseek-ai/dsh-client-ui-theme"
  config:
    preference: dark
- id: kmh-codex-cli
